name: Bootstrap Contact Hunter

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/contact-hunter.tar.gz.b64
          base64 --decode /tmp/contact-hunter.tar.gz.b64 > /tmp/contact-hunter.tar.gz
          tar -xzf /tmp/contact-hunter.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Contact Hunter MVP"
          git push origin HEAD:main
