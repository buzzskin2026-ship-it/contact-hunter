[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-hunter"
version = "0.8.0"
description = "Motore persistente per censire, verificare e deduplicare contatti B2B pubblici da web e open data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "beautifulsoup4>=4.13,<5.0",
  "lxml>=5.3,<7.0",
  "phonenumbers>=9.0,<10.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=5.9,<7.0",
  "playwright>=1.50,<2.0",
  "scrapy>=2.16,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 is an intentional FastAPI dependency/form declaration pattern.
# The remaining ignores cover pre-existing formatting/modernization warnings;
# correctness errors (E/F and the rest of B) remain blocking in CI.
ignore = ["E501", "B008", "I001", "UP012", "UP017", "UP037", "UP042"]

[tool.ruff.lint.per-file-ignores]
# The nested coroutine is created and awaited inside the same queue iteration;
# the SearchJob object cannot advance to a later loop iteration before gather ends.
"app/services/campaign_engine.py" = ["B023"]
