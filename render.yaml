services:
  - type: web
    name: contact-hunter
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: contact-hunter-db
          property: connectionString
      - key: CAMPAIGN_QUEUE_BATCH_SIZE
        value: "100"
      - key: CAMPAIGN_MAX_ATTEMPTS
        value: "2"
      - key: CAMPAIGN_RECOVERY_JOBS
        value: "25"
      - key: CAMPAIGN_DISCOVERY_BATCH_SIZE
        value: "500"
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: OSM_MAX_RECORDS_PER_COUNTRY
        value: "0"
      - key: OSM_TIMEOUT_SECONDS
        value: "180"
      - key: OPEN_DATA_ENABLED
        value: "true"
      - key: OPEN_DATA_MAX_QUERIES
        value: "0"
      - key: OPEN_DATA_DATASETS_PER_QUERY
        value: "1000"
      - key: OPEN_DATA_MAX_RESOURCES
        value: "0"
      - key: OPEN_DATA_DELAY_SECONDS
        value: "0.1"
      - key: SEARCH_RESULT_LIMIT
        value: "500"
      - key: PUBLIC_SEARCH_FALLBACK_ENABLED
        value: "true"
      - key: PUBLIC_SEARCH_MAX_QUERIES
        value: "0"
      - key: PUBLIC_SEARCH_DELAY_SECONDS
        value: "0.8"
      - key: COMMON_CRAWL_ENABLED
        value: "true"
      - key: COMMON_CRAWL_MAX_DOMAINS
        value: "0"
      - key: COMMON_CRAWL_URLS_PER_DOMAIN
        value: "25"
      - key: COMMON_CRAWL_DELAY_SECONDS
        value: "0.15"
      - key: CRAWLER_USER_AGENT
        value: "ContactHunter/0.8 (+https://contact-hunter.onrender.com)"
      - key: CRAWLER_DELAY_SECONDS
        value: "0.35"
      - key: CRAWLER_TIMEOUT_SECONDS
        value: "15"
      - key: CRAWLER_PAGE_TIMEOUT_SECONDS
        value: "12"
      - key: CRAWLER_DOMAIN_TIMEOUT_SECONDS
        value: "45"
      - key: CRAWLER_SITEMAP_TIMEOUT_SECONDS
        value: "6"
      - key: CRAWLER_PLAYWRIGHT_TIMEOUT_SECONDS
        value: "12"
      - key: CRAWLER_QUICK_PAGES_PER_DOMAIN
        value: "6"
      - key: CRAWLER_MAX_PAGES_PER_DOMAIN
        value: "16"
      - key: CRAWLER_MAX_RESPONSE_BYTES
        value: "20000000"
      - key: CRAWLER_CONCURRENCY
        value: "8"
      - key: SITEMAP_ENABLED
        value: "true"
      - key: SITEMAP_MAX_URLS_PER_DOMAIN
        value: "25"
      - key: PDF_ENABLED
        value: "true"
      - key: PDF_MAX_PAGES
        value: "100"
      - key: STRUCTURED_DOCUMENTS_ENABLED
        value: "true"
      - key: STRUCTURED_DOCUMENT_MAX_ROWS
        value: "100000"
      - key: RESPECT_ROBOTS_TXT
        value: "true"
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: KEEP_PAGE_SNAPSHOTS
        value: "false"

databases:
  - name: contact-hunter-db
    plan: free
    region: frankfurt
    databaseName: contact_hunter
    user: contact_hunter
    ipAllowList: []
